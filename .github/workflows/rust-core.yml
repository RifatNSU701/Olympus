name: Rust Core

on:
  push:
    branches: [main]
    paths: ['services/core/**']
  pull_request:
    paths: ['services/core/**']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/core/Cargo.toml', 'services/core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check
        run: cargo check
      - name: Test
        run: cargo test
      - name: Format
        run: cargo fmt --check
