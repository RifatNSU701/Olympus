spring.application.name=olympus-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/olympus}
spring.datasource.username=${DB_USERNAME:olympus}
spring.datasource.password=${DB_PASSWORD:olympus}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
olympus.security.jwt.secret=${JWT_SECRET:change-me-in-production-with-a-long-random-secret}
olympus.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
