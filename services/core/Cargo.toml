[package]
name = "olympus-core"
version = "0.1.0"
edition = "2024"
description = "Olympus high-performance marketplace core API"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
dotenvy = "0.15"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "cors"] }
uuid = { version = "1", features = ["serde", "v4"] }
